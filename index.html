<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Hall Remembers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Hall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<canvas id="c"></canvas>
<div id="touch"></div>
<div id="vig"></div>
<div id="hud">
  <div class="top">
    <div class="group" id="timeG" role="group" aria-label="Time of day">
      <span class="lbl">Time</span>
      <button id="t-dawn" data-v="dawn">Dawn</button>
      <button id="t-day" data-v="day" class="on">Day</button>
      <button id="t-dusk" data-v="dusk">Dusk</button>
      <button id="t-night" data-v="night">Night</button>
    </div>
    <div class="group" id="stageG" role="group" aria-label="Town stage">
      <span class="lbl">Town</span>
      <button id="s-1" data-v="1">Founding</button>
      <button id="s-2" data-v="2" class="on">Growing</button>
    </div>
    <div class="group" id="lookG" role="group" aria-label="Art look">
      <span class="lbl">Look</span>
      <button id="l-quat" data-v="quat">Full</button>
      <button id="l-plain" data-v="plain" class="on">Light</button>
    </div>
    <div class="group" id="crowdG" role="group" aria-label="Crowd test: how many villagers">
      <span class="lbl">Crowd</span>
      <button data-v="0" class="on">Off</button>
      <button data-v="30">30</button>
      <button data-v="60">60</button>
      <button data-v="120">120</button>
      <button data-v="200">200</button>
    </div>
    <div class="group" id="animG" role="group" aria-label="Crowd test: how they are animated">
      <span class="lbl">Animation</span>
      <button data-v="usual" class="on">Usual</button>
      <button data-v="baked">Baked</button>
    </div>
  </div>
  <div class="side">
    <button class="round" id="viewBtn" aria-label="Switch to first-person view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="viewLbl">First person</span>
    </button>
    <button class="round small" id="zoomBtn">Zoom</button>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="lookpad" hidden>Drag here to look</div>
  <div id="info">Left thumb: walk</div>
  <div id="toast" hidden></div>
  <div id="crowdInfo" hidden></div>
</div>
<div id="loading">Building the street…</div>
<script type="module" src="/src/main.ts"></script>
